name: CLI CI

on:
  workflow_run:
    workflows: ["API CI"]
    types: [completed]
    branches: [develop]
  push:
    branches: [develop]
    paths:
      - "cli/**"
      - ".github/workflows/cli-ci.yaml"
  pull_request:
    branches: [develop]
    paths:
      - "cli/**"
      - ".github/workflows/cli-ci.yaml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    defaults:
      run:
        working-directory: cli

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download API image artifact
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: uuid-api-image
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp

      - name: Load API image from artifact
        if: github.event_name == 'workflow_run'
        run: |
          docker load -i /tmp/uuid_api.tar
          docker images uuid_api:latest

      - name: Run build script
        run: ./build/build.sh
