name: Timelib CI

on:
  push:
    branches: [main]
    paths:
      - "timelib/**"
      - ".github/workflows/timelib-ci.yaml"
  pull_request:
    branches: [main]
    paths:
      - "timelib/**"
      - ".github/workflows/timelib-ci.yaml"
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: timelib

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run build script
        run: ./build/build.sh
