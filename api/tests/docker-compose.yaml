services:
  api:
    image: uuid_api:latest
    container_name: uuid_api
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "/uuid_api", "--health"]
      interval: 2s
      timeout: 5s
      retries: 5

  tests:
    build:
      context: ./e2e
      dockerfile: Dockerfile
    container_name: tests
    environment:
      - API_URL=http://api:8080
    depends_on:
      api:
        condition: service_healthy
